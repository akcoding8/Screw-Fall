name: Deploy Screw Fall to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # Optional non-secret repository variable; normally leave this unset.
      SCREW_FALL_BASE: ${{ vars.SCREW_FALL_BASE }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node and npm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run automated tests
        run: npm test
      - name: Verify generated icons
        run: npm run generate:pwa-assets -- --check
      - name: Resolve deployment base
        id: base
        run: echo "base=$(node scripts/resolve-base.mjs)" >> "$GITHUB_OUTPUT"
      - name: Build production app
        run: npm run build
        env:
          SCREW_FALL_BASE: ${{ steps.base.outputs.base }}
      - name: Verify PWA output
        run: npm run verify:pwa
        env:
          SCREW_FALL_BASE: ${{ steps.base.outputs.base }}
      - name: Verify release hygiene
        run: npm run verify:release
        env:
          SCREW_FALL_BASE: ${{ steps.base.outputs.base }}
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload production artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
