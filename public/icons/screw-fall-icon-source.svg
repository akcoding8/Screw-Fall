      <stop stop-color="#35645e"/><stop offset=".56" stop-color="#234f4d"/><stop offset="1" stop-color="#122f33"/>
    </radialGradient>
    <linearGradient id="column" x1="0" x2="1">
      <stop stop-color="#153d3e"/><stop offset=".26" stop-color="#457d75"/><stop offset=".48" stop-color="#5a9283"/><stop offset=".7" stop-color="#3b706b"/><stop offset="1" stop-color="#183f41"/>
    </linearGradient>
    <linearGradient id="ivory" x1=".1" y1="0" x2=".65" y2="1">
      <stop stop-color="#fff8df"/><stop offset=".54" stop-color="#e9eacb"/><stop offset="1" stop-color="#bed4b6"/>
    </linearGradient>
    <linearGradient id="jade" x1=".1" y1="0" x2=".7" y2="1">
      <stop stop-color="#a2ead0"/><stop offset=".5" stop-color="#5bc7a5"/><stop offset="1" stop-color="#329f87"/>
