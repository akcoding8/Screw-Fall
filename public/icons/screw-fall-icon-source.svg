<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="icon-title icon-description">
  <title id="icon-title">Screw Fall app icon</title>
  <desc id="icon-description">An original glossy coral ball descending through offset ivory and teal tower platforms on a deep teal background.</desc>
